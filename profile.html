<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Профіль - МійБлог</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="profile-app" v-cloak>
    <!-- Навігація -->
    <nav class="bg-indigo-600 text-white shadow-md p-4 mb-6">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="font-bold text-xl">МійБлог</a>
            <div class="space-x-4">
                <a href="app.html" class="hover:text-indigo-200">Блог</a>
                <button @click="logout" class="hover:text-indigo-200">Вихід</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 max-w-4xl">
        <!-- Картка профілю з аватаром та статусом -->
        <div class="bg-white p-6 rounded-lg shadow-sm border mb-8 flex items-center space-x-6">
            <img :src="'https://ui-avatars.com/api/?name=' + user.name + '&background=4f46e5&color=fff&size=128'" 
                 class="w-24 h-24 rounded-full shadow">
            <div>
                <h1 class="text-3xl font-bold">{{ user.name }}</h1>
                <!-- Відображення статусу (Bio) -->
                <p class="text-indigo-600 font-medium">{{ user.bio || 'Студент групи КВ-32' }}</p>
            </div>
        </div>

        <!-- Таблиця з даними користувача -->
        <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <th class="p-4 bg-gray-50 w-1/3">ПІБ</th>
                        <td class="p-4">{{ user.name }}</td>
                    </tr>
                    <tr>
                        <th class="p-4 bg-gray-50">Email</th>
                        <td class="p-4">{{ user.email }}</td>
                    </tr>
                    <tr>
                        <th class="p-4 bg-gray-50">Статус (Bio)</th>
                        <td class="p-4 text-gray-600">{{ user.bio || 'Не вказано' }}</td>
                    </tr>
                    <tr>
                        <th class="p-4 bg-gray-50">Стать</th>
                        <td class="p-4">{{ user.gender === 'male' ? 'Чоловіча' : 'Жіноча' }}</td>
                    </tr>
                    <tr>
                        <th class="p-4 bg-gray-50">Дата народження</th>
                        <td class="p-4">{{ user.dob }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Кнопка відкриття редагування -->
        <div class="mt-6 flex justify-end">
            <button @click="openEditModal" class="bg-indigo-600 text-white px-6 py-2 rounded shadow hover:bg-indigo-700 transition">
                Редагувати профіль
            </button>
        </div>

        <!-- Модальне вікно редагування[cite: 12] -->
        <div v-if="showEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Редагувати профіль</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ім'я</label>
                        <input v-model="editData.name" type="text" class="w-full p-2 border rounded focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Статус (Bio)</label>
                        <input v-model="editData.bio" type="text" placeholder="Наприклад: Студент КВ-32" 
                               class="w-full p-2 border rounded focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Стать</label>
                        <select v-model="editData.gender" class="w-full p-2 border rounded">
                            <option value="male">Чоловіча</option>
                            <option value="female">Жіноча</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Дата народження</label>
                        <input v-model="editData.dob" type="date" class="w-full p-2 border rounded">
                    </div>
                </div>
                
                <div class="mt-6 flex justify-end space-x-2">
                    <button @click="showEditModal = false" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Скасувати</button>
                    <button @click="saveChanges" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Зберегти</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                user: JSON.parse(localStorage.getItem('currentUser')),
                showEditModal: false,
                editData: {}
            }
        },
        mounted() {
            if (!this.user) window.location.href = 'login.html';
        },
        methods: {
            openEditModal() {
                // Копіюємо дані користувача в об'єкт редагування, щоб не змінювати профіль завчасно
                this.editData = { ...this.user };
                this.showEditModal = true;
            },
            async saveChanges() {
                try {
                    const response = await fetch('http://localhost:3000/api/user/update', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.editData)
                    });
                    
                    if (response.ok) {
                        // Оновлюємо локальний стан та localStorage
                        this.user = { ...this.editData };
                        localStorage.setItem('currentUser', JSON.stringify(this.user));
                        this.showEditModal = false;
                        alert('Профіль успішно оновлено!');
                    } else {
                        alert('Помилка сервера при оновленні даних');
                    }
                } catch (e) {
                    console.error(e);
                    alert('Не вдалося з’єднатися з сервером');
                }
            },
            logout() {
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            }
        }
    }).mount('#profile-app');
</script>
</body>
</html>
